<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>信息技术部第六党支部台账 | 党支部管理系统</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/minutes-document.css">
    <link rel="stylesheet" href="/css/minutes-document-overrides.css">
</head>
<body class="minutes-document-page">
<header class="topbar">
    <a class="brand" href="/">党支部管理系统 <span>支部工作台</span></a>
    <nav><a href="/">工作台</a><a href="/members">党员档案</a><a href="/activities">党支部会议</a><a class="active" href="/meetings">信息技术部第六党支部台账</a></nav>
    <div class="topbar-meta">信息技术部第六党支部台账</div>
</header>

<main class="document-shell">
    <div class="document-toolbar">
        <div><h1>信息技术部第六党支部台账</h1><p th:text="${entryCount + ' 条已归档记录'}">0 条已归档记录</p></div>
        <div class="document-actions"><a class="button ghost" href="/activities">返回组织生活</a><a class="button primary" href="/meetings/minutes.docx">下载 Word</a></div>
    </div>
    <div class="document-saved-notice" th:if="${updated}" role="status">纪要已保存，并已更新到文档。</div>
    <section class="word-page" aria-label="会议纪要文档">
        <h2 class="word-title">信息技术部第六党支部台账</h2>
        <div class="word-record" th:each="entry : ${entries}" th:id="|activity-${entry.activity.id}|">
            <h3 class="record-title" th:text="${entry.ordinal + '、' + entry.dateText + '，' + entry.headingText}">一、会议日期，支部活动名称</h3>
            <p class="record-line"><span>主题：</span><span th:text="${entry.themeText}">活动主题</span></p>
            <p class="record-line"><span>地点：</span><span th:text="${entry.locationText}">会议地点</span></p>
            <p class="record-line"><span>参会人员：</span><span th:text="${entry.participantText}">总行机关信息技术部第六党支部全体党员</span></p>
            <p class="record-line"><span>请假人员：</span><span th:text="${entry.excusedNames == null or entry.excusedNames.isBlank() ? '无' : entry.excusedNames}">请假党员</span></p>
            <div class="record-section" th:if="${entry.minutes.content != null and !entry.minutes.content.isBlank()}">
                <p class="section-label">一、第一议题学习：</p>
                <p class="record-body" th:each="paragraph : ${entry.minutes.contentParagraphs}" th:classappend="${entry.minutes.isNumberedParagraph(paragraph) ? ' numbered-paragraph' : ''}" th:text="${paragraph}">第一议题学习内容</p>
            </div>
            <div class="record-section" th:if="${entry.minutes.decisions != null and !entry.minutes.decisions.isBlank()}">
                <p class="section-label" th:text="${entry.minutes.content == null or entry.minutes.content.isBlank() ? '一、内容：' : '二、内容：'}">二、内容：</p>
                <p class="record-body" th:each="paragraph : ${entry.minutes.decisionParagraphs}" th:classappend="${entry.minutes.isNumberedParagraph(paragraph) ? ' numbered-paragraph' : ''}" th:text="${paragraph}">会议内容</p>
            </div>
            <a class="edit-record" th:href="@{/activities/{id}/minutes(id=${entry.activity.id})}">编辑本条纪要</a>
        </div>
        <div class="document-empty" th:if="${#lists.isEmpty(entries)}">
            <p>这里会汇总已保存的组织生活会议纪要。</p>
            <a class="button primary" href="/activities">前往组织生活</a>
        </div>
    </section>
</main>
</body>
</html>
