<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>党员档案</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<header class="topbar"><div class="brand">党支部管理系统 <span>初稿</span></div><nav><a href="/">工作台</a><a class="active" href="/members">党员档案</a><a href="/activities">组织生活</a><a href="/meetings">会议纪要</a></nav></header>
<main class="page">
    <section class="page-heading"><div><p class="eyebrow">党员全生命周期</p><h1>党员档案</h1><p class="muted">记录基础信息和发展党员关键时间节点。</p></div></section>
    <section class="panel form-panel"><div class="panel-title"><h2 th:text="${editMode} ? '编辑党员档案' : '新增党员档案'">新增党员档案</h2><a th:if="${editMode}" href="/members">取消编辑</a></div>
        <form th:action="${editMode} ? '/members/' + member.id : '/members'" method="post" class="form-grid">
        <label>姓名<input name="name" required placeholder="请输入姓名" th:value="${member.name}"></label>
        <label>性别<select name="gender"><option value="" th:selected="${member.gender == null or member.gender == ''}">请选择</option><option value="男" th:selected="${member.gender == '男'}">男</option><option value="女" th:selected="${member.gender == '女'}">女</option></select></label>
        <label>联系方式<input name="phone" placeholder="手机或办公电话" th:value="${member.phone}"></label>
        <label>当前状态<select name="status"><option th:each="item : ${statusOptions}" th:value="${item}" th:text="${item}" th:selected="${item == member.status}">状态</option></select></label>
        <label>提交申请书<input type="date" name="applicationDate" th:value="${member.applicationDate}"></label>
        <label>确定为积极分子<input type="date" name="activistDate" th:value="${member.activistDate}"></label>
        <label>确定为发展对象<input type="date" name="developmentObjectDate" th:value="${member.developmentObjectDate}"></label>
        <label>接收为预备党员<input type="date" name="probationaryDate" th:value="${member.probationaryDate}"></label>
        <label>转为正式党员<input type="date" name="fullMemberDate" th:value="${member.fullMemberDate}"></label>
        <div class="form-actions"><button class="button primary" type="submit" th:text="${editMode} ? '保存修改' : '保存档案'">保存档案</button></div>
    </form></section>
    <section class="panel"><div class="panel-title"><h2>档案列表</h2><span class="muted" th:text="${#lists.size(members)} + ' 人'">0 人</span></div>
        <form action="/members" method="get" class="filter-bar">
            <label class="filter-keyword">搜索党员<input name="keyword" th:value="${keyword}" placeholder="按姓名或联系方式搜索"></label>
            <label>状态<select name="status"><option value="" th:selected="${selectedStatus == ''}">全部状态</option><option value="正式党员" th:selected="${selectedStatus == '正式党员'}">正式党员</option><option value="预备党员" th:selected="${selectedStatus == '预备党员'}">预备党员</option><option value="发展对象" th:selected="${selectedStatus == '发展对象'}">发展对象</option><option value="积极分子" th:selected="${selectedStatus == '积极分子'}">积极分子</option><option value="入党申请人" th:selected="${selectedStatus == '入党申请人'}">入党申请人</option></select></label>
            <div class="filter-actions"><button class="button primary" type="submit">查询</button><a class="button" href="/members">重置</a></div>
        </form>
        <div class="table-wrap"><table><thead><tr><th>姓名</th><th>状态</th><th>联系方式</th><th>申请日期</th><th>预备党员日期</th><th>转正日期</th><th>操作</th></tr></thead>
            <tbody><tr th:each="item : ${members}"><td><b th:text="${item.name}">姓名</b></td><td><span class="tag" th:text="${item.status}">状态</span></td><td th:text="${item.phone}">电话</td><td th:text="${item.applicationDate}">日期</td><td th:text="${item.probationaryDate}">日期</td><td th:text="${item.fullMemberDate}">日期</td><td class="actions"><a class="button small" th:href="@{/members/{id}/edit(id=${item.id})}">编辑</a><form th:action="@{/members/{id}/delete(id=${item.id})}" method="post" onsubmit="return confirm('确定删除这条党员档案吗？删除后不可恢复，请先确认已完成备份。');"><button class="button small danger" type="submit">删除</button></form></td></tr>
            <tr th:if="${#lists.isEmpty(members)}"><td colspan="7" class="empty">没有符合条件的党员档案。</td></tr></tbody></table></div>
    </section>
</main>
</body></html>
